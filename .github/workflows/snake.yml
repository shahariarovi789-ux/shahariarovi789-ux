name: Generate Snake

on:
  schedule:
    - cron: "0 */12 * * *" # Runs every 12 hours
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v3

      - name: Generate Snake SVG
        uses: Platane/snk/svg-only@v3
        with:
          github_user_name: shahariarovi789-ux
          outputs: |
            github-contribution-grid-snake.svg?palette=github-dark&color_snake=%238b5cf6&color_dots=%23161b22,%233b0764,%23581c87,%23701a75,%23a21caf,%23d946ef

      - name: Commit & Push Changes
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add github-contribution-grid-snake.svg
          git commit -m "chore: update contribution snake animation with custom purple palette using svg-only" || exit 0
          git push
